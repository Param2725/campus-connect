# Render Blueprint Specification for Lab 7
# Deploys API Gateway (public) and User, Product, Order Microservices
# All services connect to MongoDB Atlas
version: "1"
services:
  # ─── 1. Public API Gateway ─────────────────────────────────
  - type: web
    name: campusconnect-api-gateway
    env: node
    plan: free
    rootDir: api-gateway
    buildCommand: npm install --production
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-user-service
          property: host
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-product-service
          property: host
      - key: ORDER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-order-service
          property: host

  # ─── 2. User Microservice ──────────────────────────────────
  - type: web
    name: campusconnect-user-service
    env: node
    plan: free
    rootDir: user-service
    buildCommand: npm install --production
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3001
      - key: MONGO_URI
        value: mongodb+srv://parampatel2725_db_user:JyQgUM5y0Y1f7I85@cluster0.2oibzss.mongodb.net/campus_users?retryWrites=true&w=majority

  # ─── 3. Product Microservice ───────────────────────────────
  - type: web
    name: campusconnect-product-service
    env: node
    plan: free
    rootDir: product-service
    buildCommand: npm install --production
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3002
      - key: MONGO_URI
        value: mongodb+srv://parampatel2725_db_user:JyQgUM5y0Y1f7I85@cluster0.2oibzss.mongodb.net/campus_products?retryWrites=true&w=majority

  # ─── 4. Order Microservice ─────────────────────────────────
  - type: web
    name: campusconnect-order-service
    env: node
    plan: free
    rootDir: order-service
    buildCommand: npm install --production
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3003
      - key: MONGO_URI
        value: mongodb+srv://parampatel2725_db_user:JyQgUM5y0Y1f7I85@cluster0.2oibzss.mongodb.net/campus_orders?retryWrites=true&w=majority
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-user-service
          property: host
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-product-service
          property: host
