<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" style="background:#090d16; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="gwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef"/>
      <stop offset="100%" stop-color="#7579ff"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <linearGradient id="ordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f857a6"/>
      <stop offset="100%" stop-color="#ff5858"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0575e6"/>
      <stop offset="100%" stop-color="#00f260"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#b224ef" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b224ef"/>
    </marker>
    <marker id="arrowCyan" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#00f2fe"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38f9d7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#fee140"/>
    </marker>
    <marker id="arrowPink" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff5858"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="38" text-anchor="middle" fill="#58a6ff" font-size="21" font-weight="700" letter-spacing="1">CAMPUSCONNECT • LAB 7 ARCHITECTURE</text>
  <text x="500" y="60" text-anchor="middle" fill="#8b949e" font-size="13">API Gateway • Configuration-Based Service Discovery • Cloud Container Deployment</text>

  <!-- ═════════ LAYER 1: CLIENT LAYER (INTERNET) ═════════ -->
  <g filter="url(#cardGlow)">
    <rect x="350" y="85" width="300" height="65" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="350" y="85" width="6" height="65" rx="3" fill="url(#clientGrad)"/>
    <text x="375" y="113" fill="#f0f6fc" font-size="16" font-weight="600">Client / Postman</text>
    <text x="375" y="133" fill="#8b949e" font-size="12">Internet • Sends all requests to Single Public Entry Point</text>
  </g>

  <!-- Arrow: Client -> Gateway -->
  <line x1="500" y1="150" x2="500" y2="185" stroke="#00f2fe" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <text x="515" y="172" fill="#58a6ff" font-size="11" font-family="monospace">HTTP / REST (Port 4000)</text>

  <!-- ═════════ LAYER 2: API GATEWAY (PUBLIC REVERSE PROXY) ═════════ -->
  <g filter="url(#cardGlow)">
    <rect x="120" y="190" width="760" height="110" rx="12" fill="#131926" stroke="#b224ef" stroke-width="2"/>
    <rect x="120" y="190" width="8" height="110" rx="4" fill="url(#gwGrad)"/>
    <text x="145" y="222" fill="#f0f6fc" font-size="18" font-weight="700">API GATEWAY (Single Public Entry Point)</text>
    <rect x="540" y="206" width="130" height="22" rx="4" fill="#238636"/>
    <text x="605" y="221" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">PUBLIC PORT: 4000</text>
    <rect x="680" y="206" width="180" height="22" rx="4" fill="#1f6feb"/>
    <text x="770" y="221" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">CLOUD REACHABLE</text>

    <!-- Gateway capabilities -->
    <text x="145" y="250" fill="#a5d6ff" font-size="12">🛡️ Reverse-Proxy Routing: /users/*, /products/*, /orders/*</text>
    <text x="495" y="250" fill="#7ee787" font-size="12">🩺 Health Check: GET /health (Local &amp; Cloud)</text>
    <text x="145" y="275" fill="#ffd33d" font-size="12">📝 Morgan Request Logging (Method, Path, Status, Time)</text>
    <text x="495" y="275" fill="#ff7b72" font-size="12">🚨 Centralized 502/503 Resilience on Downstream Failure</text>
    <text x="145" y="293" fill="#d2a8ff" font-size="11">⚙️ Service Registry (Config Discovery): USER_SERVICE_URL, PRODUCT_SERVICE_URL, ORDER_SERVICE_URL</text>
  </g>

  <!-- ═════════ LAYER 3: DOCKER BRIDGE NETWORK BOUNDARY (INTERNAL ONLY) ═════════ -->
  <rect x="40" y="330" width="920" height="250" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="60" y="320" width="310" height="24" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="215" y="336" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600">🔒 DOCKER INTERNAL NETWORK (campus-network)</text>
  <text x="780" y="336" text-anchor="middle" fill="#f85149" font-size="11" font-weight="600">PORTS NOT EXPOSED TO HOST</text>

  <!-- Arrows from Gateway to Microservices -->
  <path d="M 270 300 L 200 370" fill="none" stroke="#38f9d7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 500 300 L 500 370" fill="none" stroke="#fee140" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M 730 300 L 800 370" fill="none" stroke="#ff5858" stroke-width="2" marker-end="url(#arrowPink)"/>

  <!-- User Service Card -->
  <g filter="url(#cardGlow)">
    <rect x="70" y="375" width="260" height="175" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="70" y="375" width="6" height="175" rx="3" fill="url(#userGrad)"/>
    <text x="90" y="405" fill="#f0f6fc" font-size="15" font-weight="700">USER MICROSERVICE</text>
    <text x="90" y="425" fill="#8b949e" font-size="12">Internal Port: 3001</text>
    <text x="90" y="450" fill="#7ee787" font-size="11">GET /users, GET /users/:id</text>
    <text x="90" y="470" fill="#7ee787" font-size="11">POST /users, PUT, DELETE</text>
    <text x="90" y="495" fill="#8b949e" font-size="11">Isolated Domain: Student &amp; Faculty</text>
    <text x="90" y="525" fill="#58a6ff" font-size="11">Env: MONGO_URI (campus_users)</text>
  </g>

  <!-- Product Service Card -->
  <g filter="url(#cardGlow)">
    <rect x="370" y="375" width="260" height="175" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="370" y="375" width="6" height="175" rx="3" fill="url(#prodGrad)"/>
    <text x="390" y="405" fill="#f0f6fc" font-size="15" font-weight="700">PRODUCT MICROSERVICE</text>
    <text x="390" y="425" fill="#8b949e" font-size="12">Internal Port: 3002</text>
    <text x="390" y="450" fill="#ffd33d" font-size="11">GET /products, GET /products/:id</text>
    <text x="390" y="470" fill="#ffd33d" font-size="11">POST /products, PUT, DELETE</text>
    <text x="390" y="495" fill="#8b949e" font-size="11">Isolated Domain: Books &amp; Hardware</text>
    <text x="390" y="525" fill="#58a6ff" font-size="11">Env: MONGO_URI (campus_products)</text>
  </g>

  <!-- Order Service Card -->
  <g filter="url(#cardGlow)">
    <rect x="670" y="375" width="260" height="175" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="670" y="375" width="6" height="175" rx="3" fill="url(#ordGrad)"/>
    <text x="690" y="405" fill="#f0f6fc" font-size="15" font-weight="700">ORDER MICROSERVICE</text>
    <text x="690" y="425" fill="#8b949e" font-size="12">Internal Port: 3003</text>
    <text x="690" y="450" fill="#ff7b72" font-size="11">POST /orders, GET /orders</text>
    <text x="690" y="470" fill="#ff7b72" font-size="11">Inter-Service: Calls User &amp; Product</text>
    <text x="690" y="495" fill="#8b949e" font-size="11">Isolated Domain: Transactions &amp; Orders</text>
    <text x="690" y="525" fill="#58a6ff" font-size="11">Env: MONGO_URI (campus_orders)</text>
  </g>

  <!-- Horizontal Inter-Service Call: Order Service -> User & Product -->
  <path d="M 670 470 C 580 470, 420 470, 335 470" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrowCyan)"/>
  <text x="500" y="465" text-anchor="middle" fill="#79c0ff" font-size="10" font-family="monospace">Inter-Service Validation Calls</text>

  <!-- ═════════ LAYER 4: CLOUD DATABASE (MONGODB ATLAS) ═════════ -->
  <!-- Connecting lines to Database -->
  <line x1="200" y1="550" x2="250" y2="620" stroke="#38f9d7" stroke-width="1.8" stroke-dasharray="3,3"/>
  <line x1="500" y1="550" x2="500" y2="620" stroke="#fee140" stroke-width="1.8" stroke-dasharray="3,3"/>
  <line x1="800" y1="550" x2="750" y2="620" stroke="#ff5858" stroke-width="1.8" stroke-dasharray="3,3"/>

  <g filter="url(#cardGlow)">
    <rect x="120" y="620" width="760" height="95" rx="12" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <rect x="120" y="620" width="8" height="95" rx="4" fill="url(#dbGrad)"/>
    <text x="145" y="650" fill="#f0f6fc" font-size="17" font-weight="700">CLOUD DATABASE LAYER • MONGODB ATLAS CLUSTER</text>
    <text x="145" y="675" fill="#7ee787" font-size="12">cluster0.2oibzss.mongodb.net • Isolated Database Per Microservice Pattern</text>

    <!-- DB Boxes -->
    <rect x="145" y="685" width="180" height="22" rx="4" fill="#0d1117" stroke="#38f9d7" stroke-width="1"/>
    <text x="235" y="700" text-anchor="middle" fill="#38f9d7" font-size="11">campus_users DB</text>

    <rect x="410" y="685" width="180" height="22" rx="4" fill="#0d1117" stroke="#fee140" stroke-width="1"/>
    <text x="500" y="700" text-anchor="middle" fill="#fee140" font-size="11">campus_products DB</text>

    <rect x="675" y="685" width="180" height="22" rx="4" fill="#0d1117" stroke="#ff5858" stroke-width="1"/>
    <text x="765" y="700" text-anchor="middle" fill="#ff5858" font-size="11">campus_orders DB</text>
  </g>

  <!-- Footer caption -->
  <text x="500" y="745" text-anchor="middle" fill="#8b949e" font-size="11">Full Stack Flow: Client → API Gateway (Port 4000) → Service Discovery Config → Microservices (Internal) → MongoDB Atlas</text>
</svg>
